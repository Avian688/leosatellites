[General]
network = QueueCompatibility
sim-time-limit = 2s
cmdenv-express-mode = false
**.scalar-recording = false
**.vector-recording = false
**.interfaceTableModule = ""
**.explicitCapacity*.queue.packetCapacity = 73
**.queue.numQueues = 2
**.queue.queue[*].packetCapacity = 17

[Config Defaults]
# Legacy interface names retain their respective default queue types.

[Config Selected]
# 4 runs: immutable simple queues, a compound queue, and no capacity parameter.
**.queue.typename = ${queueType="inet.queueing.queue.DropTailQueue", "inet.queueing.queue.DropHeadQueue", "inet.queueing.queue.PriorityQueue", "inet.queueing.queue.OmittedPacketQueue"}
*.test.expectedQueue = ${queueType}
