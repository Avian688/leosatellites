# Generate topology.ini first using generateRoutingExamples.py.
include topology.ini

[Config CaptureReplay170]
description = "Capture topology immediately before original 170s; reuse primary saves"
sim-time-limit = 170.000002s
**.loadFiles = true
*.configurator.kPathSnapshotMode = "disabled"
*.channelConstructor.captureReplayAt = 170s
*.channelConstructor.replayStateFile = "../../leoSaves/replay/170.leoreplay"

[Config Replay170To270]
description = "Local 0-100s follows original 170-270s, using saved edge-disjoint paths"
sim-time-limit = 100s
**.loadFiles = true
*.channelConstructor.replayStart = 170s
*.channelConstructor.replayStateFile = "../../leoSaves/replay/170.leoreplay"
*.configurator.kPathSnapshotMode = "load"
*.configurator.kPathsEdgeDisjoint = true
*.configurator.kPathMaxSharedLinks = -1
